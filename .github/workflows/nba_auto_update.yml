name: NBA AI Auto Update

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-auto-update
  cancel-in-progress: false

jobs:
  nba-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore BALLDONTLIE API cache
        uses: actions/cache/restore@v4
        with:
          path: .nba_api_cache
          key: nba-api-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nba-api-cache-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NBA AI background update
        env:
          NBA_WORKER: '1'
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python app.py

      - name: Save BALLDONTLIE API cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .nba_api_cache
          key: nba-api-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish public history snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history_*.json.gz
          if git diff --cached --quiet; then
            echo "No history snapshot changes"
          else
            git commit -m "Update public NBA history snapshot"
            git push
          fi

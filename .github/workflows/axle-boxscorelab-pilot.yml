name: AXLE BoxScore Lab CSV audit
on:
  pull_request:
    branches: [main]
    paths: [axle_boxscorelab_audit.py, .github/workflows/axle-boxscorelab-pilot.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download public CSV files
        run: |
          curl -fL --max-time 60 https://www.boxscorelab.com/downloads/2024-25-team-game-results.csv -o box_2025.csv
          curl -fL --max-time 60 https://www.boxscorelab.com/downloads/2025-26-team-game-results.csv -o box_2026.csv
          sha256sum box_2025.csv box_2026.csv
      - name: Inspect actual schema and coverage
        run: python axle_boxscorelab_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boxscorelab-audit
          path: boxscorelab_audit.json
          if-no-files-found: warn
          retention-days: 7

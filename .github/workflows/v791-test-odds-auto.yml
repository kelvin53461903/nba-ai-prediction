
name: V7.9.1 TEST Odds Auto Collector


on:
  # TEST SAFETY: scheduled runs disabled until validation.
  # schedule:
  #   - cron: '20 0,6,12,18 * * *'
  workflow_dispatch:

    inputs:
      confirm_write:
        description: 'Choose YES to write to TEST Supabase'
        required: true
        type: choice
        default: 'NO'
        options:
          - 'NO'
          - 'YES'

permissions:
  contents: read

concurrency:
  group: v791-test-odds-auto
  cancel-in-progress: false

jobs:
  collect-test-odds:
    name: Collect NBA totals to TEST only
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3'

      - name: Validate collector syntax
        run: python -m py_compile v791_test_odds_collector.py

      - name: Check snapshot freshness
        id: freshness
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/odds_latest.json")
          fresh = False

          if path.is_file():
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  raw = data["retrieved_at_utc"]
                  captured = datetime.fromisoformat(
                      raw.replace("Z", "+00:00")
                  )
                  if captured.tzinfo is None:
                      raise ValueError("Timestamp has no timezone")

                  age = (
                      datetime.now(timezone.utc)
                      - captured.astimezone(timezone.utc)
                  ).total_seconds()

                  print(f"Snapshot age: {age / 60:.1f} minutes")
                  fresh = 0 <= age <= 1800
              except (ValueError, KeyError, TypeError) as exc:
                  print(f"Snapshot validation failed: {type(exc).__name__}")
          else:
              print("Snapshot file missing")

          print(f"Snapshot fresh: {fresh}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"fresh={'true' if fresh else 'false'}\n")
          PY

      - name: Collect totals (DRY RUN)
        if: steps.freshness.outputs.fresh == 'true'
        env:
          V791_ODDS_WRITE: 'NO'
        run: python v791_test_odds_collector.py

     
      - name: Write totals to TEST
        if: >-
          steps.freshness.outputs.fresh == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.confirm_write == 'YES'

        env:
          V791_ODDS_WRITE: 'YES'
          V791_TEST_SUPABASE_URL: ${{ secrets.V791_TEST_SUPABASE_URL }}
          V791_TEST_SUPABASE_KEY: ${{ secrets.V791_TEST_SUPABASE_KEY }}
          V791_TEST_PROJECT_REF: ${{ secrets.V791_TEST_PROJECT_REF }}
        run: python v791_test_odds_collector.py

      - name: Report stale snapshot
        if: steps.freshness.outputs.fresh != 'true'
        run: |
          echo "Snapshot is missing, invalid, or stale."
          echo "TEST database write skipped."

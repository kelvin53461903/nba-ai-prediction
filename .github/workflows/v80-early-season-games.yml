name: NBA V8.0 Extend Historical Games 2020-2024

on:
  push:
    branches:
      - v8.0-calibration-test
    paths:
      - 'normalize_v80_early_season_types.py'
      - 'validate_v80_early_season_games.py'
      - 'import_v80_early_season_games.py'
      - 'v80_multi_season_walkforward.py'
      - 'v80_recent_form_backtest.py'
      - 'v80_database_test.py'
      - '.github/workflows/v80-early-season-games.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v80-early-season-artifact-validation
  cancel-in-progress: false

jobs:
  validate-import-backtest:
    if: github.ref == 'refs/heads/v8.0-calibration-test'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: v80-calibration-test
    steps:
      - name: Checkout isolated V8.0 test branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download previously collected 2020-24 historical CSV artifact
        uses: actions/download-artifact@v4
        with:
          name: v80-early-season-games-2020-2024
          repository: ${{ github.repository }}
          run-id: 45752300873
          github-token: ${{ github.token }}
          path: .
      - name: Compile and normalize season labels
        run: |
          python -m py_compile normalize_v80_early_season_types.py validate_v80_early_season_games.py
          python normalize_v80_early_season_types.py
      - name: Validate full historical CSV and official season coverage
        run: python validate_v80_early_season_games.py
      - name: Install secure Neon import and backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'psycopg[binary]>=3.2,<4' certifi
      - name: Compile isolated database importer and walk-forward backtest
        run: python -m py_compile import_v80_early_season_games.py v80_multi_season_walkforward.py v80_recent_form_backtest.py
      - name: Dry-run expanded historical import
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
          CONFIRM_EARLY_SEASON_IMPORT: YES
          IMPORT_MODE: dry-run
        run: python import_v80_early_season_games.py
      - name: Commit validated historical games to isolated V8.0 test database
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
          CONFIRM_EARLY_SEASON_IMPORT: YES
          IMPORT_MODE: commit
        run: python import_v80_early_season_games.py
      - name: Re-run all 32 isolated Neon security checks after import
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python v80_database_test.py
      - name: Run expanding-window six-season walk-forward test
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python v80_multi_season_walkforward.py
      - name: Upload normalized data and walk-forward report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v80-early-season-games-2020-2024
          path: |
            data/nba_v80_historical_games_2020_2023.csv
            v80_early_seasons_validation.json
            v80_multi_season_walkforward.json
          if-no-files-found: warn
          retention-days: 30

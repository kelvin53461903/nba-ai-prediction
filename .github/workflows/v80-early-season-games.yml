name: NBA V8.0 Extend Historical Games 2020-2024

on:
  push:
    branches:
      - v8.0-calibration-test
    paths:
      - 'collect_v80_early_season_games.py'
      - 'collect_bdl_historical_games.py'
      - 'validate_v80_early_season_games.py'
      - 'import_v80_early_season_games.py'
      - 'v80_multi_season_walkforward.py'
      - 'v80_recent_form_backtest.py'
      - '.github/workflows/v80-early-season-games.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v80-early-season-games
  cancel-in-progress: false

jobs:
  collect-early-seasons:
    if: github.ref == 'refs/heads/v8.0-calibration-test'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: v80-calibration-test
    steps:
      - name: Checkout isolated V8.0 test branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install API collection dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'requests>=2.32,<3'
      - name: Compile historical collector
        run: python -m py_compile collect_v80_early_season_games.py collect_bdl_historical_games.py
      - name: Collect 2020-21 through 2023-24 regular season and playoff results
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: python collect_v80_early_season_games.py
      - name: Validate expanded historical CSV
        run: python validate_v80_early_season_games.py
      - name: Compile isolated database importer
        run: python -m py_compile import_v80_early_season_games.py
      - name: Dry-run expanded historical import
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
          CONFIRM_EARLY_SEASON_IMPORT: YES
          IMPORT_MODE: dry-run
        run: python import_v80_early_season_games.py
      - name: Commit validated historical games to isolated V8.0 test database
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
          CONFIRM_EARLY_SEASON_IMPORT: YES
          IMPORT_MODE: commit
        run: python import_v80_early_season_games.py
      - name: Compile multi-season walk-forward backtest
        run: python -m py_compile v80_multi_season_walkforward.py v80_recent_form_backtest.py
      - name: Run expanding-window six-season walk-forward test
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python v80_multi_season_walkforward.py
      - name: Upload historical games and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v80-early-season-games-2020-2024
          path: |
            data/nba_v80_historical_games_2020_2023.csv
            v80_early_seasons_validation.json
            v80_multi_season_walkforward.json
          if-no-files-found: warn
          retention-days: 30

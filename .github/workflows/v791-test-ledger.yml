name: V7.9.1 TEST Settlement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v791-test-settlement
  cancel-in-progress: false

jobs:
  dry-run:
    name: Test settlement (no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3'

      - name: Check V7.9.1 TEST settlement
        env:
          V791_TEST_SUPABASE_URL: ${{ secrets.V791_TEST_SUPABASE_URL }}
          V791_TEST_SUPABASE_KEY: ${{ secrets.V791_TEST_SUPABASE_KEY }}
          V791_TEST_PROJECT_REF: ${{ secrets.V791_TEST_PROJECT_REF }}
          V791_TEST_BDL_API_KEY: ${{ secrets.V791_TEST_BDL_API_KEY }}
          V791_SETTLEMENT_WRITE: 'NO'
        run: python v791_test_worker.py

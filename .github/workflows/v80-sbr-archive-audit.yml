name: NBA V8.0 SBR MIT Archive Schema Audit

on:
  push:
    branches:
      - v8.0-calibration-test
    paths:
      - 'audit_v80_sbr_archive.py'
      - '.github/workflows/v80-sbr-archive-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-sbr:
    if: github.ref == 'refs/heads/v8.0-calibration-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m py_compile audit_v80_sbr_archive.py
      - run: python audit_v80_sbr_archive.py

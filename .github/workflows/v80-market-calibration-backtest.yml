name: NBA V8.0 Market Calibration Backtest

on:
  push:
    branches:
      - v8.0-calibration-test
    paths:
      - 'v80_market_calibration_backtest.py'
      - 'v80_database.py'
      - '.github/workflows/v80-market-calibration-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v80-market-calibration-backtest
  cancel-in-progress: false

jobs:
  heldout-market-backtest:
    if: github.ref == 'refs/heads/v8.0-calibration-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: v80-calibration-test
    steps:
      - name: Checkout isolated V8.0 test branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install secure PostgreSQL dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'psycopg[binary]>=3.2,<4' certifi
      - name: Verify Python syntax
        run: python -m py_compile v80_market_calibration_backtest.py v80_database.py
      - name: Run 2025-26 held-out calibration benchmark
        env:
          V80_TEST_DATABASE_URL: ${{ secrets.V80_TEST_DATABASE_URL }}
        run: python v80_market_calibration_backtest.py
      - name: Upload market calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v80-market-calibration-backtest
          path: v80_market_calibration_backtest.json
          if-no-files-found: warn

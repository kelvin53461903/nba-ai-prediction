name: NBA V8.0 Phase 10.4 Date-Grouped Backtest Tests
on:
  push:
    branches:
      - v8.0-phase10.4-date-grouped-backtest
    paths:
      - 'scripts/v80_market_backtest.py'
      - 'tests/test_v80_market_backtest.py'
      - '.github/workflows/v80-phase10-4-date-grouped-tests.yml'
  pull_request:
    branches:
      - v8.0-phase10.4-date-grouped-backtest
    paths:
      - 'scripts/v80_market_backtest.py'
      - 'tests/test_v80_market_backtest.py'
      - '.github/workflows/v80-phase10-4-date-grouped-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase 10.4 unit tests
        run: python -m unittest discover -s tests -p 'test_v80_market_backtest.py' -v
      - name: Compile backtest module
        run: python -m py_compile scripts/v80_market_backtest.py

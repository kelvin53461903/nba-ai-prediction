name: AXLE NBA Data v2 audit
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/axle-nbadata-pilot.yml, axle_nbadata_match.py, axle_market_research.py]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: v8.0-calibration-test
          path: historical-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyarrow
      - name: Download documented archive
        run: |
          for year in 2025 2026; do
            for dataset in games team_game_logs; do
              curl -fL --max-time 60 "https://basketball-data.billmill.org/nba/stats/$dataset/season=$year/data.parquet" -o "${dataset}_$year.parquet"
            done
          done
          sha256sum *.parquet
      - name: Inspect schema and coverage
        run: |
          python - <<'PY'
          import pyarrow.parquet as pq
          from collections import Counter
          for y in (2025,2026):
              g=pq.ParquetFile(f"games_{y}.parquet").read()
              t=pq.ParquetFile(f"team_game_logs_{y}.parquet").read()
              print(y,g.schema,t.schema,flush=True)
              print("Game types",Counter(g["game_type"].to_pylist()))
              print("Team records",t.num_rows,"Game IDs",len(set(t["game_id"].to_pylist())))
              assert len(set(g["game_id"].to_pylist()))==g.num_rows
              assert len(set(zip(t["game_id"].to_pylist(),t["team_id"].to_pylist())))==t.num_rows
          PY
      - name: Download historical market archives
        run: |
          for y in 2025 2026; do
            curl -fL --max-time 60 "https://basketball-data.billmill.org/nba/espn/betting_lines/season=$y/data.parquet" -o "lines_$y.parquet"
          done
          sha256sum lines_*.parquet
      - name: Reconcile historical games
        run: python axle_nbadata_match.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbadata-match-audit
          path: nbadata_match_audit.json
          if-no-files-found: warn
          retention-days: 7

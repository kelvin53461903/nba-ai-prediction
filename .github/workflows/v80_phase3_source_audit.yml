name: NBA V8.0 Phase 3 Historical Odds Source Audit

on:
  workflow_dispatch:
  push:
    branches:
      - v8.0-phase2-historical-market-audit
    paths:
      - "scripts/v80_phase3_source_audit.py"
      - "tests/test_v80_phase3_source_audit.py"
      - "scripts/v80_phase4b_sbr_repair_audit.py"
      - "tests/test_v80_phase4b_sbr_repair_audit.py"
      - "scripts/v80_phase4c_consensus_audit.py"
      - "tests/test_v80_phase4c_consensus_audit.py"
      - "scripts/v80_phase4d_espn_crosswalk_audit.py"
      - "tests/test_v80_phase4d_espn_crosswalk_audit.py"
      - "scripts/v80_phase4e_targeted_gap_audit.py"
      - "tests/test_v80_phase4e_targeted_gap_audit.py"
      - "scripts/v80_phase4f_date_offset_audit.py"
      - "tests/test_v80_phase4f_date_offset_audit.py"
      - "scripts/v80_phase4g_full_crosswalk_audit.py"
      - "tests/test_v80_phase4g_full_crosswalk_audit.py"
      - "scripts/v80_phase4h_line_coverage_audit.py"
      - "tests/test_v80_phase4h_line_coverage_audit.py"
      - "scripts/v80_phase5_market_dataset.py"
      - "tests/test_v80_phase5_market_dataset.py"
      - "scripts/v80_phase6_market_benchmark.py"
      - "tests/test_v80_phase6_market_benchmark.py"
      - "scripts/v80_phase7_calibration_gate.py"
      - "tests/test_v80_phase7_calibration_gate.py"
      - "scripts/v80_phase6b_rolling_features.py"
      - "tests/test_v80_phase6b_rolling_features.py"
      - ".github/workflows/v80_phase3_source_audit.yml"

permissions:
  contents: read

concurrency:
  # Each audit is read-only and may need a long historical API scan. Avoid
  # letting a stale run block the newer bounded-concurrency implementation.
  group: nba-v80-phase3-source-audit-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  read-only-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check duckdb psycopg[binary] certifi requests numpy pandas scikit-learn
      - name: Compile Python files
        run: |
          python -m py_compile scripts/v80_phase3_source_audit.py tests/test_v80_phase3_source_audit.py scripts/v80_phase4b_sbr_repair_audit.py tests/test_v80_phase4b_sbr_repair_audit.py scripts/v80_phase4c_consensus_audit.py tests/test_v80_phase4c_consensus_audit.py scripts/v80_phase4d_espn_crosswalk_audit.py tests/test_v80_phase4d_espn_crosswalk_audit.py scripts/v80_phase4e_targeted_gap_audit.py tests/test_v80_phase4e_targeted_gap_audit.py scripts/v80_phase4f_date_offset_audit.py tests/test_v80_phase4f_date_offset_audit.py scripts/v80_phase4g_full_crosswalk_audit.py tests/test_v80_phase4g_full_crosswalk_audit.py scripts/v80_phase4h_line_coverage_audit.py tests/test_v80_phase4h_line_coverage_audit.py scripts/v80_phase5_market_dataset.py tests/test_v80_phase5_market_dataset.py scripts/v80_phase6_market_benchmark.py tests/test_v80_phase6_market_benchmark.py scripts/v80_phase7_calibration_gate.py tests/test_v80_phase7_calibration_gate.py scripts/v80_phase6b_rolling_features.py tests/test_v80_phase6b_rolling_features.py
      - name: Run parser unit tests
        run: python -m unittest discover -s tests -p "test_v80_phase3_source_audit.py" -v
      - name: Run repaired SBR parser unit tests
        run: python -m unittest discover -s tests -p "test_v80_phase4b_sbr_repair_audit.py" -v
      - name: Run Phase 4C consensus parser tests
        run: python -m unittest discover -s tests -p "test_v80_phase4c_consensus_audit.py" -v
      - name: Run Phase 4D ESPN crosswalk parser tests
        run: python -m unittest discover -s tests -p "test_v80_phase4d_espn_crosswalk_audit.py" -v
      - name: Run Phase 4E targeted gap diagnostic tests
        run: python -m unittest discover -s tests -p "test_v80_phase4e_targeted_gap_audit.py" -v
      - name: Run Phase 4F exact-score offset tests
        run: python -m unittest discover -s tests -p "test_v80_phase4f_date_offset_audit.py" -v
      - name: Run Phase 4G full crosswalk exact-score tests
        run: python -m unittest discover -s tests -p "test_v80_phase4g_full_crosswalk_audit.py" -v
      - name: Run Phase 4H line coverage tests
        run: python -m unittest discover -s tests -p "test_v80_phase4h_line_coverage_audit.py" -v
      - name: Run Phase 5 market dataset tests
        run: python -m unittest discover -s tests -p "test_v80_phase5_market_dataset.py" -v
      - name: Run Phase 6 benchmark unit tests
        run: python -m unittest discover -s tests -p "test_v80_phase6_market_benchmark.py" -v
      - name: Run Phase 6B rolling feature tests
        run: python -m unittest discover -s tests -p "test_v80_phase6b_rolling_features.py" -v
      - name: Run Phase 7 calibration gate unit tests
        run: python -m unittest discover -s tests -p "test_v80_phase7_calibration_gate.py" -v
      - name: Verify isolated database secret is configured
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: |
          if [ -z "$V80_HISTORICAL_IMPORT_DATABASE_URL" ]; then
            echo "::error::Missing V80_HISTORICAL_IMPORT_DATABASE_URL. Configure it with the isolated nba_v80 test-branch connection string."
            exit 1
          fi
      - name: Run read-only source audit
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python scripts/v80_phase3_source_audit.py
      - name: Run repaired SBR market audit (read-only)
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python scripts/v80_phase4b_sbr_repair_audit.py
      - name: Run Phase 4C consensus closing-line source audit (read-only)
        run: python scripts/v80_phase4c_consensus_audit.py
      - name: Run Phase 4D ESPN-to-NBA crosswalk audit (read-only)
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python scripts/v80_phase4d_espn_crosswalk_audit.py
      - name: Run Phase 4E targeted ESPN gap diagnostic (read-only)
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python scripts/v80_phase4e_targeted_gap_audit.py
      - name: Run Phase 4F exact-score adjacent-date audit (read-only)
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python scripts/v80_phase4f_date_offset_audit.py
      - name: Run Phase 4G full six-season exact-score crosswalk (read-only)
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python scripts/v80_phase4g_full_crosswalk_audit.py
      - name: Run Phase 4H line-level market coverage audit (read-only)
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python scripts/v80_phase4h_line_coverage_audit.py
      - name: Run Phase 5 chronological benchmark dataset build (read-only)
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python scripts/v80_phase5_market_dataset.py
      - name: Run Phase 6 chronological spread/total benchmark
        run: python scripts/v80_phase6_market_benchmark.py
      - name: Run Phase 6B leak-safe rolling team form feature engineering
        run: python scripts/v80_phase6b_rolling_features.py
      - name: Run Phase 7 probability calibration and release-risk assessment
        run: python scripts/v80_phase7_calibration_gate.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-v80-phase3-source-audit
          path: |
            artifacts/v80_phase3/
            artifacts/v80_phase4b/
            artifacts/v80_phase4c/
            artifacts/v80_phase4d/
            artifacts/v80_phase4e/
            artifacts/v80_phase4f/
            artifacts/v80_phase4g/
            artifacts/v80_phase4h/
            artifacts/v80_phase5/
            artifacts/v80_phase6/
            artifacts/v80_phase7/
            artifacts/v80_phase6b/
          if-no-files-found: warn
          retention-days: 30

name: NBA V8.0 Score Regression Spread and Totals Backtest

on:
  push:
    branches:
      - v8.0-calibration-test
    paths:
      - 'v80_score_regression_backtest.py'
      - 'v80_recent_form_backtest.py'
      - '.github/workflows/v80-score-regression-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v80-score-regression-backtest
  cancel-in-progress: false

jobs:
  score-regression:
    if: github.ref == 'refs/heads/v8.0-calibration-test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: v80-calibration-test
    steps:
      - name: Checkout isolated V8.0 test branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install regression and secure database dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'psycopg[binary]>=3.2,<4' certifi 'scikit-learn>=1.5,<2'
      - name: Compile regression experiment
        run: python -m py_compile v80_score_regression_backtest.py v80_recent_form_backtest.py
      - name: Run temporal spread and totals regression backtest
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python v80_score_regression_backtest.py
      - name: Upload score regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v80-score-regression-spread-totals-backtest
          path: v80_score_regression_backtest.json
          if-no-files-found: warn

name: NBA V8.0 Streamlit UI Safety Test

on:
  push:
    branches:
      - v8.0-calibration-test
    paths:
      - 'app.py'
      - 'v80_ui_safety_test.py'
      - '.github/workflows/v80-ui-safety-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v80-ui-safety-test
  cancel-in-progress: false

jobs:
  ui-safety:
    if: github.ref == 'refs/heads/v8.0-calibration-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated V8.0 test branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify app syntax and hidden simulation output
        run: |
          python -m py_compile app.py v80_ui_safety_test.py
          python v80_ui_safety_test.py

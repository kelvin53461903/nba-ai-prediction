
name: V7.9.1 TEST Odds Write

on:
  workflow_dispatch:
    inputs:
      confirm_write:
        description: "Type YES to write to TEST Supabase"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"

permissions:
  contents: read

concurrency:
  group: v791-test-odds-write
  cancel-in-progress: false

jobs:
  write-test-odds:
    name: Write NBA totals to TEST only
    if: ${{ inputs.confirm_write == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3'

      - name: Validate collector syntax
        run: python -m py_compile v791_test_odds_collector.py

      - name: Write historical totals to TEST
        env:
          V791_ODDS_WRITE: 'YES'
          V791_TEST_SUPABASE_URL: ${{ secrets.V791_TEST_SUPABASE_URL }}
          V791_TEST_SUPABASE_KEY: ${{ secrets.V791_TEST_SUPABASE_KEY }}
          V791_TEST_PROJECT_REF: ${{ secrets.V791_TEST_PROJECT_REF }}
        run: python v791_test_odds_collector.py

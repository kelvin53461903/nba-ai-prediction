name: NBA V8.0 Model vs Market Three-Market Backtest

on:
  push:
    branches:
      - v8.0-calibration-test
    paths:
      - 'v80_model_vs_market_backtest.py'
      - 'v80_recent_form_backtest.py'
      - '.github/workflows/v80-model-vs-market-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v80-model-vs-market-backtest
  cancel-in-progress: false

jobs:
  compare-model-market:
    if: github.ref == 'refs/heads/v8.0-calibration-test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: v80-calibration-test
    steps:
      - name: Checkout isolated V8.0 test branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install secure PostgreSQL dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'psycopg[binary]>=3.2,<4' certifi
      - name: Compile backtest
        run: python -m py_compile v80_model_vs_market_backtest.py v80_recent_form_backtest.py
      - name: Compare model and market on same held-out games
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python v80_model_vs_market_backtest.py
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v80-model-vs-market-three-market-backtest
          path: v80_model_vs_market_backtest.json
          if-no-files-found: warn

name: NBA V8.0 Import MIT SBR Historical Market Lines

on:
  push:
    branches:
      - v8.0-calibration-test
    paths:
      - 'import_v80_sbr_historical_lines.py'
      - 'data/V80_SBR_IMPORT_APPROVED.txt'
      - '.github/workflows/v80-sbr-market-import.yml'
      - 'v80_database_test.py'
  workflow_dispatch:
    inputs:
      import_mode:
        description: 'Dry-run first; commit only to isolated V8.0 test database'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - commit
      confirm_import:
        description: 'Confirm SBR import to isolated nba_v80 test database'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: v80-sbr-market-import
  cancel-in-progress: false

jobs:
  import-sbr:
    if: github.ref == 'refs/heads/v8.0-calibration-test' && (github.event_name == 'push' || inputs.confirm_import == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: v80-calibration-test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install secure Neon dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'psycopg[binary]>=3.2,<4' certifi
      - name: Compile importer
        run: python -m py_compile import_v80_sbr_historical_lines.py
      - name: Dry-run or import verified SBR historical lines
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
          CONFIRM_SBR_IMPORT: ${{ (github.event_name == 'push' || inputs.confirm_import == true) && 'YES' || 'NO' }}
          IMPORT_MODE: ${{ github.event_name == 'push' && github.event.head_commit.message == 'AUTHORIZE V8.0 SBR IMPORT' && 'commit' || github.event_name == 'push' && 'dry-run' || inputs.import_mode }}
        run: python import_v80_sbr_historical_lines.py
      - name: Re-run all 32 isolated Neon security tests
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'AUTHORIZE V8.0 SBR IMPORT' && 'true' || inputs.import_mode == 'commit' && inputs.confirm_import == true }}
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python v80_database_test.py

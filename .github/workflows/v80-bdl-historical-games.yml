name: NBA V8.0 Historical Games (BALLDONTLIE Free)

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: 'First NBA season start year'
        required: true
        default: '2024'
        type: choice
        options: ['2023', '2024', '2025']
      end_season:
        description: 'Last NBA season start year'
        required: true
        default: '2025'
        type: choice
        options: ['2024', '2025', '2026']
      dry_run:
        description: 'Dry run only (no API requests)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  collect-games:
    if: ${{ github.ref == 'refs/heads/v8.0-calibration-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install 'requests>=2.31,<3'
      - name: Validate collector syntax
        run: python -m py_compile collect_bdl_historical_games.py
      - name: Collect historical games
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          START_SEASON: ${{ inputs.start_season }}
          END_SEASON: ${{ inputs.end_season }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          args=(--start-season "$START_SEASON" --end-season "$END_SEASON" --out /tmp/nba-v80-games)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python collect_bdl_historical_games.py "${args[@]}"
      - name: Upload historical games CSV
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: nba-v80-historical-games-${{ inputs.start_season }}-${{ inputs.end_season }}
          path: /tmp/nba-v80-games/*.csv
          if-no-files-found: error
          retention-days: 30

name: NBA V8.0 Phase 7C CC-BY Market Model Research

on:
  workflow_dispatch:
  push:
    branches:
      - v8.0-phase2-historical-market-audit
    paths:
      - "scripts/v80_phase7c_ccby_market_research.py"
      - "tests/test_v80_phase7c_ccby_market_research.py"
      - ".github/workflows/v80_phase7c_ccby_market_research.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: nba-v80-phase7c-ccby-market-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn requests
      - name: Download verified six-season game crosswalk artifact
        uses: actions/download-artifact@v4
        with:
          name: nba-v80-phase3-source-audit
          run-id: 45806673683
          github-token: ${{ github.token }}
          path: artifacts
      - name: Compile and test
        run: |
          python -m py_compile scripts/v80_phase7c_ccby_market_research.py tests/test_v80_phase7c_ccby_market_research.py
          python -m unittest discover -s tests -p "test_v80_phase7c_ccby_market_research.py" -v
      - name: Run CC-BY-4.0 market model research
        run: python scripts/v80_phase7c_ccby_market_research.py
      - name: Upload research-only report
        uses: actions/upload-artifact@v4
        with:
          name: nba-v80-phase7c-ccby-market-research
          path: artifacts/v80_phase7c/
          if-no-files-found: error
          retention-days: 30

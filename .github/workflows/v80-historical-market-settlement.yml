name: NBA V8.0 Historical Market Settlement Audit

on:
  push:
    branches:
      - v8.0-calibration-test
    paths:
      - 'v80_historical_market_settlement.py'
      - 'v80_recent_form_backtest.py'
      - '.github/workflows/v80-historical-market-settlement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settle-markets:
    if: github.ref == 'refs/heads/v8.0-calibration-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: v80-calibration-test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install secure database dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'psycopg[binary]>=3.2,<4' certifi
      - name: Compile settlement audit
        run: python -m py_compile v80_historical_market_settlement.py v80_recent_form_backtest.py
      - name: Settle historical SBR and consensus markets (read-only)
        env:
          V80_HISTORICAL_IMPORT_DATABASE_URL: ${{ secrets.V80_HISTORICAL_IMPORT_DATABASE_URL }}
        run: python v80_historical_market_settlement.py
      - name: Upload settlement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v80-historical-market-settlement
          path: v80_historical_market_settlement.json
          if-no-files-found: warn
          retention-days: 30

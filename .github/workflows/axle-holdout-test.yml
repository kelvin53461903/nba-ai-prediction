name: AXLE prospective intake tests
on:
  push:
    branches: [v8.0-prospective-holdout]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyarrow
      - run: python -m unittest -v axle_holdout_test

      - run: python axle_holdout_settle.py
      - run: python axle_holdout_ingest.py


name: V7.9.1 TEST Odds Collector

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v791-test-odds-collector
  cancel-in-progress: false

jobs:
  dry-run:
    name: Validate NBA totals snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'requests>=2.32,<3'

      - name: Validate collector syntax
        run: python -m py_compile v791_test_odds_collector.py

      - name: Check historical totals (DRY RUN)
        env:
          V791_ODDS_WRITE: 'NO'
        run: python v791_test_odds_collector.py

name: AXLE official stats pilot
on:
  push:
    branches: [v8.0-axle-hybrid-test]
    paths: [.github/workflows/axle-official-pilot.yml, axle_collect_advanced.py]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leakage gate test
        run: |
          python - <<'PY'
          from axle_hybrid import advanced_score
          from datetime import datetime
          tip=datetime.fromisoformat('2026-01-02T00:00:00+00:00')
          base=dict(source='NBA.com',is_reconstructed=False,season='2025-26',cutoff_date='2025-12-31',captured_at_utc='2026-01-01T00:00:00+00:00',available_at_utc='2026-01-01T00:00:00+00:00',offensive_rating=110,defensive_rating=110,pace=100)
          a=dict(base,team_id=1); b=dict(base,team_id=2)
          assert advanced_score(a,b,tip)==(110,110)
          for change in (dict(is_reconstructed=True),dict(available_at_utc=tip.isoformat()),dict(cutoff_date='2026-01-02')):
              try: advanced_score(dict(a,**change),b,tip)
              except ValueError: pass
              else: raise AssertionError('Leakage admitted')
          PY
      - run: pip install nba_api==1.11.4
      - run: python axle_collect_advanced.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-advanced-pilot
          path: axle_advanced_pilot.json
          retention-days: 7

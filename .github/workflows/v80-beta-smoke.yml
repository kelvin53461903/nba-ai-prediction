name: V8.0 Beta smoke test
on:
  push:
    branches: [v8.0-beta]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py
      - run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          import ast, os
          tree=ast.parse(open('app.py').read())
          for name in ('cloud_config','ledger'):
              fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name==name)
              assert len(fn.body)==1 and isinstance(fn.body[0],ast.Return)
          for key in ('BDL_API_KEY','BALLDONTLIE_API_KEY','NBA_WORKER'):
              os.environ.pop(key,None)
          at=AppTest.from_file('app.py',default_timeout=30).run()
          assert not at.exception, at.exception
          assert any('V8.0 Beta' in t.value for t in at.title)
          assert any('API Key' in t.value for t in at.info)
          print('BETA_STARTUP PASS (no API key)')
          PY
